<section>
  <div class="flex justify-between items-end mb-10">
    <div>
      <h2 class="text-3xl font-serif font-bold text-heading">Browse by Category</h2>
      <p class="text-body mt-2">Find exactly what you're craving.</p>
    </div>
  </div>

  <div class="flex justify-center items-center flex-wrap gap-12">
    @for (cat of categories(); track cat._id) {
      <a
        href="/recipes?category={{ cat._id }}"
        class="group text-center flex flex-col items-center"
      >
        <div
          class="w-40 h-40 bg-white border border-default rounded-full flex items-center justify-center mb-4 group-hover:border-brand group-hover:shadow-md transition-all duration-300 overflow-hidden"
        >
          <img
            src="https://placehold.co/800/f26419/white?text={{ cat.name }}&font=roboto"
            class="w-full h-full object-cover group-hover:opacity-80 group-hover:scale-110 transition-transform duration-300"
          />
        </div>

        <span class="font-bold text-heading group-hover:text-brand transition-colors">
          {{ cat.name }}
        </span>
      </a>
    }
  </div>
</section>
