<form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="space-y-8">
  <div class="grid md:grid-cols-2 gap-6">
    <div class="space-y-2">
      <label class="block text-sm font-bold text-heading uppercase tracking-tighter">
        Recipe Title
      </label>
      <input
        type="text"
        formControlName="title"
        placeholder="e.g. Grandma's Spicy Rigatoni"
        class="bg-neutral-primary-soft border border-default text-heading placeholder:text-body/40 text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3 transition-all"
      />
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-bold text-heading uppercase tracking-tighter">
        Category
      </label>
      <select
        formControlName="category"
        class="bg-neutral-primary-soft border border-default text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3 cursor-pointer appearance-none transition-all"
      >
        <option value="">Select Category</option>
        @for (cat of categories(); track cat._id) {
          <option [value]="cat._id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="space-y-2 col-span-2">
      <label class="block text-sm font-bold text-heading uppercase tracking-tighter">
        Recipe Image
      </label>

      <input
        type="file"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="bg-neutral-primary-soft border border-default text-heading placeholder:text-body/40 text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3 transition-all"
      />

      @if (imagePreview) {
        <div class="mt-2">
          <img [src]="imagePreview" alt="Image Preview" class="h-32 object-cover rounded-md" />
        </div>
      }
    </div>
  </div>

  <div class="space-y-2">
    <label class="text-xs font-bold text-heading uppercase tracking-tighter">
      Recipe Description & Instructions
    </label>
    <textarea
      formControlName="description"
      rows="5"
      placeholder="Tell the community how to prepare this dish..."
      class="w-full bg-neutral-primary-soft border border-default rounded-base p-4 focus:ring-2 focus:ring-brand-medium focus:border-brand focus:outline-none text-heading placeholder:text-body/40 text-sm transition-all"
    ></textarea>
  </div>

  <div class="space-y-2">
    <label class="text-xs font-bold text-heading uppercase tracking-tighter">Ingredients</label>
    <div formArrayName="ingredients" class="space-y-2">
      <div
        *ngFor="let ing of ingredients.controls; let i = index"
        [formGroupName]="i"
        class="grid grid-cols-3 gap-2"
      >
        <input
          formControlName="name"
          placeholder="Ingredient Name"
          class="border p-2 rounded col-span-1"
        />
        <input
          formControlName="quantity"
          placeholder="Quantity"
          class="border p-2 rounded col-span-1"
        />
        <button type="button" (click)="removeIngredient(i)" class="text-red-500 font-bold">
          Remove
        </button>
      </div>
    </div>
    <button type="button" (click)="addIngredient()" class="text-brand font-bold mt-2">
      + Add Ingredient
    </button>
  </div>

  <div class="space-y-2">
    <label class="text-xs font-bold text-heading uppercase tracking-tighter">Steps</label>
    <div formArrayName="steps" class="space-y-2">
      <div *ngFor="let step of steps.controls; let i = index" class="flex items-center gap-2">
        <input
          [formControlName]="i"
          placeholder="Step description"
          class="border p-2 rounded flex-1"
        />
        <button type="button" (click)="removeStep(i)" class="text-red-500 font-bold">Remove</button>
      </div>
    </div>
    <button type="button" (click)="addStep()" class="text-brand font-bold mt-2">+ Add Step</button>
  </div>

  <div class="flex flex-col md:flex-row items-center justify-end gap-4">
    <button
      type="button"
      (click)="cancel.emit()"
      class="w-full md:w-auto px-8 py-4 text-sm font-bold text-body hover:text-heading transition-colors"
    >
      Discard Changes
    </button>

    <button
      type="submit"
      [disabled]="recipeForm.invalid"
      class="group flex items-center justify-center gap-3 w-full md:w-auto bg-brand text-white px-12 py-4 rounded-base font-bold hover:bg-brand-strong transition-all duration-300 shadow-lg hover:shadow-brand-medium disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ initialData ? 'Update Recipe' : 'Publish Recipe' }}
      <svg
        class="w-5 h-5 group-hover:translate-x-1 transition-transform"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M14 5l7 7m0 0l-7 7m7-7H3"
        />
      </svg>
    </button>
  </div>
</form>
