<div
  class="bg-neutral-primary-soft border border-default rounded-base overflow-hidden group hover:shadow-md transition-all"
>
  <div class="relative aspect-video overflow-hidden">
    <img
      [src]="data.image"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
    />

    <button
      [id]="'dropdownButton-' + data._id"
      [attr.data-dropdown-toggle]="'dropdownMenu-' + data._id"
      class="absolute top-3 right-3 p-1.5 bg-white/90 backdrop-blur rounded-full text-heading hover:text-brand shadow-sm transition-colors"
      type="button"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"
        />
      </svg>
    </button>

    <div
      [id]="'dropdownMenu-' + data._id"
      class="z-10 hidden bg-white divide-y divide-gray-100 rounded-lg shadow w-44"
    >
      <ul class="py-2 text-sm text-heading" [attr.aria-labelledby]="'dropdownButton-' + data._id">
        <li>
          <a
            [routerLink]="['/recipes', data._id]"
            class="block px-4 py-2 hover:bg-stone-50 hover:text-brand"
            >View Recipe</a
          >
        </li>
        <li>
          <a
            [routerLink]="['/recipes/edit', data._id]"
            class="block px-4 py-2 hover:bg-stone-50 hover:text-brand"
            >Edit Details</a
          >
        </li>
      </ul>
      <div class="py-2">
        <button
          [attr.data-modal-target]="'deleteModal-' + data._id"
          [attr.data-modal-toggle]="'deleteModal-' + data._id"
          class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50"
        >
          Delete Recipe
        </button>
      </div>
    </div>
  </div>

  <div class="p-6">
    <div class="flex justify-between items-start mb-2">
      <h3
        class="text-xl font-serif font-bold text-heading group-hover:text-brand transition-colors line-clamp-1"
      >
        {{ data.title }}
      </h3>
      <span class="bg-brand-softer text-brand text-[10px] font-bold px-2 py-1 rounded"
        >Published</span
      >
    </div>
    <div class="flex items-center gap-4 text-xs text-body font-medium">
      <span class="flex items-center gap-1">
        <svg class="w-3 h-3 fill-brand" viewBox="0 0 20 20">
          <path
            d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z"
          />
        </svg>
        {{ data.likes || 0 }} Likes
      </span>
      <span class="flex items-center gap-1">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"
          />
        </svg>
        {{ data.comments || 0 }} Comments
      </span>
    </div>
  </div>
</div>

<div
  [id]="'deleteModal-' + data._id"
  tabindex="-1"
  class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
>
  <div class="relative p-4 w-full max-w-md max-h-full">
    <div class="relative bg-white rounded-base shadow">
      <button
        type="button"
        class="absolute top-3 inset-e-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
        [attr.data-modal-hide]="'deleteModal-' + data._id"
      >
        <svg
          class="w-3 h-3"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 14 14"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
          />
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
      <div class="p-4 md:p-5 text-center">
        <svg
          class="mx-auto mb-4 text-gray-400 w-12 h-12"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 20 20"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
          />
        </svg>
        <h3 class="mb-5 text-lg font-normal text-heading">
          Are you sure you want to delete <br /><span class="font-bold">"{{ data.title }}"</span>?
        </h3>
        <button
          [attr.data-modal-hide]="'deleteModal-' + data._id"
          (click)="confirmDelete()"
          type="button"
          class="text-white bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-bold rounded-base text-sm inline-flex items-center px-5 py-2.5 text-center transition-all"
        >
          Yes, delete it
        </button>
        <button
          [attr.data-modal-hide]="'deleteModal-' + data._id"
          type="button"
          class="py-2.5 px-5 ms-3 text-sm font-medium text-heading focus:outline-none bg-white rounded-base border border-gray-200 hover:bg-gray-100 hover:text-brand focus:z-10 focus:ring-4 focus:ring-gray-100 transition-all"
        >
          No, cancel
        </button>
      </div>
    </div>
  </div>
</div>
