<form action="#">
  <div class="mb-4">
    <label for="name" class="block mb-2.5 text-sm font-medium text-heading">Your name</label>
    <input
      type="text"
      id="name"
      class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body/60"
      placeholder="e.g. John Doe"
      required
    />
    <p class="mt-2 ms-2 text-xs text-danger empty:hidden">Name is required</p>
  </div>

  <div class="mb-4">
    <label for="email" class="block mb-2.5 text-sm font-medium text-heading">Your email</label>
    <input
      type="email"
      id="email"
      class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body/60"
      placeholder="example@company.com"
      required
    />
    <p class="mt-2 ms-2 text-xs text-danger empty:hidden"></p>
  </div>

  <div class="mb-4">
    <label for="password" class="block mb-2.5 text-sm font-medium text-heading"
      >Your password</label
    >
    <input
      type="password"
      id="password"
      class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body/60"
      placeholder="•••••••••"
      required
    />
    <p class="mt-2 ms-2 text-xs text-danger empty:hidden"></p>
  </div>

  <button
    type="submit"
    class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none w-full mb-3"
  >
    Create Account
  </button>
</form>
