<main class="max-w-7xl mx-auto py-8">
  <section
    class="bg-neutral-primary border border-default rounded-base shadow-md overflow-hidden mb-12"
  >
    <div class="h-32 bg-brand-softer relative">
      <div
        class="absolute inset-0 opacity-20"
        style="
          background-image: radial-gradient(var(--color-brand) 1px, transparent 1px);
          background-size: 20px 20px;
        "
      ></div>
    </div>

    <div class="px-8 pb-8">
      <div class="relative flex flex-col md:flex-row md:items-end gap-6 -mt-12">
        <div class="relative group">
          <img
            [src]="`https://ui-avatars.com/api/?name=${auth.user().name?.replace(' ', '+')}&background=f26419&color=fff&size=128`"
            class="w-32 h-32 rounded-full border-4 border-white shadow-lg bg-white object-cover"
          />
          <!-- <button
            class="absolute bottom-0 right-0 p-2 bg-heading text-white rounded-full hover:bg-brand transition-colors shadow-md"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
          </button> -->
        </div>

        <div class="flex-1">
          <h1 class="text-3xl font-serif font-bold text-heading">{{ auth.user().name }}</h1>
          <p class="text-body text-sm mb-2">
            {{ auth.user().email }} • Joined {{ auth.user().createdAt | date }}
          </p>
          <div class="flex gap-4">
            <span class="text-sm font-bold text-heading"
              >{{ auth.user().recipesCount }}
              <span class="text-body font-normal">Recipes</span></span
            >
            <span class="text-sm font-bold text-heading"
              >{{ auth.user().favoritesCount }}
              <span class="text-body font-normal">Favorites</span></span
            >
            <span class="text-sm font-bold text-heading"
              >{{ auth.user().likesCount }} <span class="text-body font-normal">Likes</span></span
            >
          </div>
        </div>

        <div class="flex gap-3">
          <!-- <button
            class="bg-neutral-primary-soft border border-default text-heading px-6 py-2 rounded-base font-bold hover:bg-neutral-secondary-soft transition-all text-sm"
          >
            Edit Profile
          </button> -->
          <a
            routerLink="/recipes/add"
            class="bg-brand text-white px-6 py-2 rounded-base font-bold hover:bg-brand-strong transition-all text-sm shadow-md"
          >
            Add New Recipe
          </a>
        </div>
      </div>
    </div>
  </section>

  <div class="flex border-b border-default mb-8">
    <a
      routerLink="my-recipes"
      routerLinkActive="border-b-2 border-brand border-brand text-brand !font-bold"
      class="px-6 py-3 text-sm font-medium"
    >
      My Recipes
    </a>

    <a
      routerLink="favorites"
      routerLinkActive="border-b-2 border-brand border-brand text-brand !font-bold"
      class="px-6 py-3 text-sm font-medium"
    >
      Favorites
    </a>

    <a
      routerLink="liked"
      routerLinkActive="border-b-2 border-brand border-brand text-brand !font-bold"
      class="px-6 py-3 text-sm font-medium"
    >
      Liked
    </a>
  </div>

  <router-outlet />
</main>
