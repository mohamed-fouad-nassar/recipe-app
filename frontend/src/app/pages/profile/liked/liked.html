<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
  @for (recipe of store.likedRecipes(); track recipe._id) {
    <app-recipe-card
      [data]="recipe"
      [showFavorite]="false"
      (toggleLike)="facade.toggleLike(recipe)"
    />
  } @empty {
    <p class="text-center text-body col-span-full">You haven't liked any recipes yet.</p>
  }
</div>
