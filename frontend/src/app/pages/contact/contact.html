<main class="max-w-7xl mx-auto py-20">
  <div class="text-center max-w-3xl mx-auto mb-20">
    <h1 class="text-5xl font-serif font-bold text-heading mb-6">
      Let's talk
      <span class="italic text-brand underline decoration-brand-subtle underline-offset-8"
        >Flavor.</span
      >
    </h1>
    <p class="text-body text-lg leading-relaxed">
      Whether you're a brand looking to collaborate or a home cook with a question, our kitchen door
      is always open.
    </p>
  </div>

  <div class="grid lg:grid-cols-12 gap-6">
    <div class="lg:col-span-4 space-y-6">
      <div class="p-8 bg-neutral-primary-soft border border-default rounded-base shadow-xs">
        <h4 class="text-heading font-bold uppercase tracking-widest text-xs mb-6">
          Direct Support
        </h4>
        <a
          href="mailto:support@recipes.com"
          class="text-2xl font-serif text-heading hover:text-brand transition-colors break-all"
        >
          support@recipes.com
        </a>
        <div class="mt-6 flex items-center gap-2 text-brand font-medium text-sm">
          <span class="relative flex h-2 w-2">
            <span
              class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand opacity-75"
            ></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-brand"></span>
          </span>
          Average response: 4 hours
        </div>
      </div>

      <div class="p-8 bg-neutral-primary-soft border border-default rounded-base shadow-xs">
        <h4 class="text-heading font-bold uppercase tracking-widest text-xs mb-6">
          Join the Community
        </h4>
        <div class="flex gap-4">
          <a
            href="#"
            class="w-12 h-12 rounded-base bg-heading text-white flex items-center justify-center hover:bg-brand transition-all shadow-md"
            >IG</a
          >
          <a
            href="#"
            class="w-12 h-12 rounded-base bg-heading text-white flex items-center justify-center hover:bg-brand transition-all shadow-md"
            >PT</a
          >
          <a
            href="#"
            class="w-12 h-12 rounded-base bg-heading text-white flex items-center justify-center hover:bg-brand transition-all shadow-md"
            >YT</a
          >
        </div>
      </div>
    </div>

    <div
      class="lg:col-span-8 bg-neutral-primary border border-default shadow-xs rounded-base p-8 md:p-12"
    >
      <form class="space-y-8">
        <div>
          <label class="block mb-2 text-sm font-bold text-heading">Subject</label>
          <input
            required
            type="text"
            placeholder="e.g. General Inquiry"
            class="bg-neutral-primary-soft border border-default text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3"
          />
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold text-heading uppercase tracking-tighter"
            >Your Message</label
          >
          <textarea
            rows="4"
            class="w-full bg-neutral-primary-soft border border-default rounded-base p-4 focus:ring-2 focus:ring-brand-medium focus:border-brand focus:outline-none text-heading transition-all"
            placeholder="How can we help you cook better today?"
          ></textarea>
        </div>

        <button
          type="submit"
          class="group flex items-center justify-center gap-3 w-full md:w-auto bg-brand text-white px-12 py-4 rounded-base font-bold hover:bg-brand-strong transition-all duration-300 shadow-lg hover:shadow-brand-medium"
        >
          Send Message
          <svg
            class="w-5 h-5 group-hover:translate-x-1 transition-transform"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M14 5l7 7m0 0l-7 7m7-7H3"
            />
          </svg>
        </button>
      </form>
    </div>
  </div>
</main>
