<main class="max-w-7xl mx-auto py-20">
  <div class="text-center max-w-3xl mx-auto mb-20">
    <h1 class="text-5xl font-serif font-bold text-heading mb-6">
      Let's talk
      <span class="italic text-brand underline decoration-brand-subtle underline-offset-8">
        Flavor.
      </span>
    </h1>
    <p class="text-body text-lg leading-relaxed">
      Whether you're a brand looking to collaborate or a home cook with a question, our kitchen door
      is always open.
    </p>
  </div>

  <div class="grid lg:grid-cols-12 gap-6">
    <div class="lg:col-span-4">
      <app-contact-info />
      <app-contact-links />
    </div>

    <div
      class="lg:col-span-8 bg-neutral-primary border border-default shadow-xs rounded-base p-8 md:p-12"
    >
      <app-contact-form />
    </div>
  </div>
</main>
