<div
  class="flex flex-col items-center justify-center py-20 px-4 text-center bg-red-200/30 border border-red-400 rounded-base"
>
  <div class="w-16 h-16 bg-red-200 text-red-600 rounded-full flex items-center justify-center mb-6">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
      />
    </svg>
  </div>

  <h3 class="text-xl font-serif font-bold text-heading mb-2">Something went wrong</h3>
  <p class="text-red-600 max-w-sm mb-8">
    {{ message || 'Please check your connection and try again.' }}
  </p>
</div>
