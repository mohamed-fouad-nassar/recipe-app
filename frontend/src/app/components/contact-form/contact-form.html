<form class="space-y-8">
  <div>
    <label class="block mb-2 text-sm font-bold text-heading">Subject</label>
    <input
      required
      type="text"
      placeholder="e.g. General Inquiry"
      class="bg-neutral-primary-soft border border-default text-heading placeholder:text-body/40 text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3"
    />
  </div>

  <div class="space-y-2">
    <label class="text-xs font-bold text-heading uppercase tracking-tighter">Your Message</label>
    <textarea
      rows="4"
      placeholder="How can we help you cook better today?"
      class="w-full bg-neutral-primary-soft border border-default rounded-base p-4 focus:ring-2 focus:ring-brand-medium focus:border-brand focus:outline-none text-heading placeholder:text-body/40 transition-all"
    ></textarea>
  </div>

  <button
    type="submit"
    class="group flex items-center justify-center gap-3 w-full md:w-auto bg-brand text-white px-12 py-4 rounded-base font-bold hover:bg-brand-strong transition-all duration-300 shadow-lg hover:shadow-brand-medium"
  >
    Send Message
    <svg
      class="w-5 h-5 group-hover:translate-x-1 transition-transform"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M14 5l7 7m0 0l-7 7m7-7H3"
      />
    </svg>
  </button>
</form>
