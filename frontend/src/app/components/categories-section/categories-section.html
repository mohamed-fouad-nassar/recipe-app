<section>
  <div class="flex justify-between items-end mb-10">
    <div>
      <h2 class="text-3xl font-serif font-bold text-heading">Browse by Category</h2>
      <p class="text-body mt-2">Find exactly what you're craving.</p>
    </div>
    <a href="#" class="text-brand font-bold text-sm hover:underline">View All</a>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
    @for (
      cat of ['Breakfast', 'Vegan', 'Desserts', 'Italian', 'Quick Fix', 'Healthy'];
      track $index
    ) {
      <a href="#" class="group text-center">
        <div
          class="aspect-square bg-white border border-default rounded-full flex items-center justify-center mb-4 group-hover:border-brand group-hover:shadow-md transition-all duration-300 overflow-hidden"
        >
          <img
            [src]="'https://source.unsplash.com/featured/?' + cat + ',food'"
            class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-transform"
          />
        </div>
        <span class="font-bold text-heading group-hover:text-brand transition-colors">{{
          cat
        }}</span>
      </a>
    }
  </div>
</section>
